[project]
name = "fi-sv-spel"
version = "0.1.0"
description = "A web game for learning Finnish through Swedish."
authors = [{ name = "Vadim" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "jinja2 (>=3.1.4,<4.0.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
]

[tool.poetry]
packages = [{ include = "fi_sv_spel", from = "src" }]

[tool.poetry.group.dev.dependencies]
httpx = "^0.28.0"
pre-commit = "^4.0.1"
pytest = "^8.3.3"
ruff = "^0.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
